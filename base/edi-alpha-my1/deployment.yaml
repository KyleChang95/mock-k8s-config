apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-my1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-my1
  template:
    metadata:
      labels:
        app: alpha-my1
    spec:
      containers:
        - name: alpha-my1
          image: nginx:alpine
          ports:
            - containerPort: 80
