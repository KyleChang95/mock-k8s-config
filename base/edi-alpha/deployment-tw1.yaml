apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-tw1
spec:
  selector:
    matchLabels:
      app: alpha-tw1
  template:
    metadata:
      labels:
        app: alpha-tw1
    spec:
      containers:
        - name: alpha-tw1
          image: nginx
          env:
            - name: APP_SERVER_NAME
              value: edi-alpha-tw1
          ports:
            - containerPort: 80
