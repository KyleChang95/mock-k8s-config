apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-my1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-my1
  template:
    metadata:
      labels:
        app: beta-my1
    spec:
      containers:
        - name: beta-my1
          image: nginx:alpine
          ports:
            - containerPort: 80
