apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-b
  template:
    metadata:
      labels:
        app: svc-b
    spec:
      containers:
        - name: svc-b
          image: nginx:alpine
          ports:
            - containerPort: 80
