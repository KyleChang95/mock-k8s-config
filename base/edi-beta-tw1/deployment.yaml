apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-tw1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-tw1
  template:
    metadata:
      labels:
        app: beta-tw1
    spec:
      containers:
        - name: beta-tw1
          image: nginx:alpine
          ports:
            - containerPort: 80
