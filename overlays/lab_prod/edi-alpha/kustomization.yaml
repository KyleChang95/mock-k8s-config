apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-native

resources:
  - ../../../base/edi-alpha

patches:
  - path: patch-deployment-tw1.yaml
  - path: patch-deployment-my1.yaml

# 換手階段（step2）沿用舊 overlay 的 image 與 tag，確保渲染結果與舊 App 完全相同。
# 正式環境此時會有兩筆，分別對應 edi-omega-twom2 / edi-omega-myom1 兩個舊 ECR repo；
# lab 的兩個目標本來就共用 nginx，所以只有一筆。
images:
  - name: nginx
    newTag: 1.28-alpine
